name: ci

# The release gate is a script, so it is tested like one: the same command runs
# on every platform, and the cgo/SQLite build is compiled on both operating
# systems this project claims to support.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # test/eval skips without DUSTKEEPER_EVAL_BASE_URL, so no network call and
      # no credential is needed here.
      - name: test
        run: go test ./... -count=1

      - name: race
        run: go test -race ./... -count=1

      # A release must fail when a declared target is missing. On a runner with no
      # cross C compiler that is exactly the situation, so the expected exit code
      # is 1 — asserting it here keeps the gate itself under test.
      - name: release gate refuses an incomplete release
        run: |
          set +e
          ./build/build.sh --release
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "a release without every declared target exited 0"
            exit 1
          fi
          echo "release gate exited $code as expected"
